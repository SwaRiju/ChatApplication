    spring.application.name=chat

    # ===============================

    # DATABASE (Render PostgreSQL)

    # ===============================

    spring.datasource.url=${DB_URL}
    spring.datasource.username=${DB_USER}
    spring.datasource.password=${DB_PASS}
    spring.datasource.driver-class-name=org.postgresql.Driver

    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

    # ===============================

    # CORS (Frontend URL)

    # ===============================

    cors.allowed-origins=${CORS_ORIGIN}

    # ===============================

    # SECURITY (JWT)

    # ===============================

    security.jwt.issuer=${JWT_ISSUER}
    security.jwt.access-ttl=15m
    security.jwt.refresh-ttl=2h
    security.jwt.private-key-path=file:/etc/secrets/jwt-private.pem
    security.jwt.public-key-path=file:/etc/secrets/jwt-public.pem
    security.jwt.jti-hmac-secret=${JWT_SECRET}

    # ===============================

    # EMAIL CONFIG

    # ===============================

    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=${MAIL_USERNAME}
    spring.mail.password=${MAIL_PASSWORD}
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
    spring.mail.properties.mail.smtp.connectiontimeout=10000
    spring.mail.properties.mail.smtp.timeout=10000
    spring.mail.properties.mail.smtp.writetimeout=10000

    # ===============================

    # FILE UPLOAD LIMITS

    # ===============================

    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB
    server.tomcat.max-http-form-post-size=10MB
    server.tomcat.max-swallow-size=10MB

    # ===============================

    # PORT (Render assigns this)

    # ===============================

    server.port=${PORT:8080}
