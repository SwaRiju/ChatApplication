    spring.application.name=chat

    # ===============================

    # DATABASE (Render PostgreSQL)

    # ===============================

    spring.datasource.url=${DB_URL}
    spring.datasource.username=${DB_USER}
    spring.datasource.password=${DB_PASS}
    spring.datasource.driver-class-name=org.postgresql.Driver

    spring.jpa.hibernate.ddl-auto=validate
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

    # ===============================

    # CORS (Frontend URL)

    # ===============================

    cors.allowed-origins=${CORS_ORIGIN}

    # ===============================

    # SECURITY (JWT)

    # ===============================

    security.jwt.issuer=${JWT_ISSUER}
    security.jwt.access-ttl=15m
    security.jwt.refresh-ttl=2h
    security.jwt.private-key-path=file:/etc/secrets/jwt-private.pem
    security.jwt.public-key-path=file:/etc/secrets/jwt-public.pem
    security.jwt.jti-hmac-secret=${JWT_SECRET}

    # ===============================

    # EMAIL CONFIG

    # ===============================

    brevo.api-key=${BREVO_API_KEY}
    brevo.sender-email=${BREVO_SENDER_EMAIL}
    brevo.sender-name=${BREVO_SENDER_NAME:ChatApp}

    # ===============================

    # FILE UPLOAD LIMITS

    # ===============================

    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB
    server.tomcat.max-http-form-post-size=10MB
    server.tomcat.max-swallow-size=10MB

    # ===============================

    # PORT (Render assigns this)

    # ===============================

    server.port=${PORT:8080}


    app.frontend-url=${FRONTEND_URL:http://localhost:5173}