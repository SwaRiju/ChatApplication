spring.application.name=chat

spring.datasource.url=jdbc:postgresql://localhost:5432/ChatApp
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#Cors Config:
cors.allowed-origins=http://localhost:3000
config.setAllowCredentials(true);

#Security Config:
security.jwt.issuer=http://localhost:8080
# access token lifetime
security.jwt.access-ttl=15m
# absolute session window
security.jwt.refresh-ttl=2h
security.jwt.private-key-path=file:keys/jwt-private.pem
security.jwt.public-key-path=file:keys/jwt-public.pem
security.jwt.jti-hmac-secret=dev-secret-key-1234567890

#Email configuration
